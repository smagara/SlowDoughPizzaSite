name: Deploy OAuth Provider (Azure Functions)

# Deploys the Decap CMS GitHub-OAuth hand-off service in /oauth-provider to
# the Azure Function App named in site.config.json
# (oauthProvider.azure.functionAppName -> "slowoauthfn"), which is served at
# the URL in site.config.json (oauthProvider.url ->
# https://slowoauthfn-b3hzcgbnfch8bhbz.eastus2-01.azurewebsites.net).
#
# Full setup instructions: docs/INTEGRATION-GUIDE.md (section "Azure").
#
# Two authentication methods are supported; configure ONE of them as
# repository secrets (Settings -> Secrets and variables -> Actions). The
# "Select deployment method" step fails the run if neither is configured.
#
#   A) Publish profile (Consumption / Premium / Dedicated plans only):
#        AZURE_FUNCTIONAPP_PUBLISH_PROFILE   - contents of the .PublishSettings
#                                              file downloaded from the Function
#                                              App's "Get publish profile" button
#   B) OpenID Connect / Entra ID (no long-lived secret; REQUIRED for Flex
#      Consumption, recommended everywhere):
#        AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#      Federated credential subject for this job (no job environment!). GitHub
#      now embeds immutable IDs in it; the "Show OIDC subject claim" step
#      prints the exact value to configure, e.g.
#        repo:smagara@17964984/SlowDoughPizzaSite@1413782001:ref:refs/heads/main
#
# The GitHub OAuth App's client id/secret are NOT deployed from here; they are
# configured once as Application Settings on the Function App (see guide).
#
# With method A, a pre-flight step (.github/scripts/check-publish-profile.py)
# first verifies the profile against Kudu and that the OAuth app settings
# exist, and prints the exact fix if not (e.g. "SCM Basic Auth Publishing
# Credentials" disabled -> Kudu 401).

on:
  push:
    branches: [main]
    paths:
      - 'oauth-provider/**'
      - 'site.config.json'
      - '.github/workflows/deploy-oauth-provider-azure.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # needed for method B (OIDC login)

concurrency:
  group: oauth-provider-azure
  cancel-in-progress: false

env:
  PACKAGE_PATH: oauth-provider
  NODE_VERSION: '20.x'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install (with dev deps) and run tests
        working-directory: ${{ env.PACKAGE_PATH }}
        run: |
          npm ci
          npm test

  deploy:
    name: Deploy to Azure Functions
    needs: test
    runs-on: ubuntu-latest
    # NOTE: deliberately no `environment:` on this job. A job environment
    # changes the OIDC token's subject claim from
    #   repo:<owner>/<repo>:ref:refs/heads/main
    # to
    #   repo:<owner>/<repo>:environment:<name>
    # which silently breaks the Entra ID federated credential unless it was
    # created with that exact subject. Keeping the job environment-less means
    # the subject documented in docs/INTEGRATION-GUIDE.md always applies.
    env:
      # Exposed as env so the steps below can test which credentials exist.
      PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Read deployment targets from site.config.json
        id: cfg
        run: |
          APP_NAME=$(jq -r '.oauthProvider.azure.functionAppName' site.config.json)
          OAUTH_URL=$(jq -r '.oauthProvider.url' site.config.json | sed 's:/*$::')
          test -n "$APP_NAME" && test "$APP_NAME" != "null" || { echo "::error::oauthProvider.azure.functionAppName missing in site.config.json"; exit 1; }
          echo "app_name=$APP_NAME"   >> "$GITHUB_OUTPUT"
          echo "oauth_url=$OAUTH_URL" >> "$GITHUB_OUTPUT"
          echo "Deploying to Function App '$APP_NAME' ($OAUTH_URL)"

      # Decide how we authenticate to Azure, and FAIL LOUDLY if neither set
      # of secrets is present. (Without this, both deploy steps would be
      # skipped, the job would still be "green" up to the smoke test, and
      # the only symptom would be a confusing 404 from /healthz.)
      - name: Select deployment method
        id: method
        run: |
          if [ -n "$PUBLISH_PROFILE" ]; then
            echo "method=publish-profile" >> "$GITHUB_OUTPUT"
            echo "Using AZURE_FUNCTIONAPP_PUBLISH_PROFILE (method A)."
          elif [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
            echo "Using OIDC / federated credential (method B): client ${AZURE_CLIENT_ID:0:8}... tenant ${AZURE_TENANT_ID:0:8}..."
          else
            echo "::error::No Azure credentials configured. Add EITHER the repository secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE (method A) OR all three of AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (method B, required for Flex Consumption). See docs/INTEGRATION-GUIDE.md section 3b."
            [ -n "$AZURE_CLIENT_ID" ]       || echo "  missing: AZURE_CLIENT_ID"
            [ -n "$AZURE_TENANT_ID" ]       || echo "  missing: AZURE_TENANT_ID"
            [ -n "$AZURE_SUBSCRIPTION_ID" ] || echo "  missing: AZURE_SUBSCRIPTION_ID"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install production dependencies
        working-directory: ${{ env.PACKAGE_PATH }}
        run: npm ci --omit=dev

      # ---- Method A: publish profile ------------------------------------
      # Pre-flight: verify the publish profile actually works against Kudu
      # BEFORE handing it to functions-action, and explain the fix if not.
      # (functions-action's own message for this is an opaque
      # "Failed to fetch Kudu App Settings. Unauthorized (CODE: 401)".)
      # While we're connected, also confirm the OAuth app settings exist so
      # we don't deploy a service that will 500 on /auth.
      - name: Pre-flight - validate publish profile & app settings
        if: ${{ steps.method.outputs.method == 'publish-profile' }}
        env:
          EXPECTED_APP_NAME: ${{ steps.cfg.outputs.app_name }}
        run: python3 .github/scripts/check-publish-profile.py

      - name: Deploy (publish profile)
        id: deploy_profile
        if: ${{ steps.method.outputs.method == 'publish-profile' }}
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.cfg.outputs.app_name }}
          package: ${{ env.PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          respect-funcignore: true
          scm-do-build-during-deployment: false
          enable-oryx-build: false

      # ---- Method B: OIDC (federated credential) ------------------------
      # Required on Flex Consumption (no basic-auth publishing there).
      #
      # Print the exact subject claim GitHub is presenting so the Entra
      # federated credential can be configured to match it character for
      # character. NOTE: GitHub now embeds immutable IDs in the subject, e.g.
      #   repo:smagara@17964984/SlowDoughPizzaSite@1413782001:ref:refs/heads/main
      # The Entra portal's "GitHub Actions" wizard generates the OLD form
      # without IDs, which will NOT match -> AADSTS700213. Use the
      # "Other issuer" scenario (or the CLI) and paste the subject verbatim.
      - name: Show OIDC subject claim (configure this in Entra)
        if: ${{ steps.method.outputs.method == 'oidc' }}
        run: |
          set -e
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange")
          # Decode the JWT payload (claims only; the token itself is never printed).
          CLAIMS=$(echo "$RESP" | jq -r .value | python3 -c '
          import sys, json, base64
          payload = sys.stdin.read().strip().split(".")[1]
          payload += "=" * (-len(payload) % 4)
          c = json.loads(base64.urlsafe_b64decode(payload))
          keys = ["iss", "sub", "aud", "repository", "repository_id", "repository_owner_id", "job_workflow_ref"]
          print(json.dumps({k: c.get(k) for k in keys}, indent=2))')
          echo "$CLAIMS"
          SUB=$(echo "$CLAIMS" | jq -r .sub)
          echo "sub=$SUB" >> "$GITHUB_OUTPUT"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOT
          ### Entra federated credential must match
          | Field | Value |
          |---|---|
          | Issuer | \`https://token.actions.githubusercontent.com\` |
          | **Subject** | \`$SUB\` |
          | Audience | \`api://AzureADTokenExchange\` |

          \`\`\`bash
          az ad app federated-credential create --id <Application (client) ID> --parameters '{"name":"github-main","issuer":"https://token.actions.githubusercontent.com","subject":"$SUB","audiences":["api://AzureADTokenExchange"]}'
          \`\`\`
          EOT
          echo "::notice::If azure/login fails with AADSTS700213, create a federated credential with subject exactly: $SUB"
        id: oidc_sub

      - name: Azure login (OIDC)
        if: ${{ steps.method.outputs.method == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # subscription-id is deliberately NOT passed here: azure/login would
          # immediately run `az account set` and fail with the misleading
          # "The subscription of '<id>' doesn't exist in cloud 'AzureCloud'"
          # whenever the identity cannot see it yet (i.e. no role assignment).
          # The pre-flight step below selects the subscription itself and
          # explains precisely what is wrong if it cannot.
          allow-no-subscriptions: true

      # Pre-flight for OIDC: confirm the identity can actually see the
      # subscription and the app (catches a missing role assignment, a wrong
      # subscription id, or a subscription in another tenant early), report
      # the plan, and confirm the OAuth app settings exist.
      - name: Pre-flight - verify access to the Function App
        id: preflight
        if: ${{ steps.method.outputs.method == 'oidc' }}
        env:
          APP_NAME: ${{ steps.cfg.outputs.app_name }}
        run: |
          set -e
          # `az login --allow-no-subscriptions` adds a placeholder entry named
          # "N/A(tenant level account)" whose id is the tenant id; it is not a
          # subscription, so filter it out before counting.
          VISIBLE=$(az account list --all --query "[?name!='N/A(tenant level account)' && id!='$AZURE_TENANT_ID'].{id:id,name:name,tenant:tenantId,state:state}" -o json)
          COUNT=$(echo "$VISIBLE" | jq 'length')
          if [ "$COUNT" = "0" ]; then
            APP_DISPLAY=$(az ad app show --id "$AZURE_CLIENT_ID" --query displayName -o tsv 2>/dev/null || echo "<app registration with client id $AZURE_CLIENT_ID>")
            SP_OBJECT_ID=$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv 2>/dev/null || echo "<Object ID shown on Entra -> Enterprise applications -> $APP_DISPLAY -> Overview>")
            echo "::error::Signed in to tenant $AZURE_TENANT_ID as the service principal of app registration '$APP_DISPLAY' ($AZURE_CLIENT_ID), but that principal has NO role assignment in any subscription, so Azure shows it zero subscriptions. This is an Azure RBAC problem, not a GitHub secrets problem."
            echo "  IMPORTANT: the role must be assigned to THIS principal - the app registration's service principal (Entra -> Enterprise applications -> '$APP_DISPLAY')."
            echo "  It is NOT the Function App's own managed identity (Function App -> Identity); roles granted there do not apply to GitHub Actions."
            echo "  Identity details: Application (client) ID = $AZURE_CLIENT_ID (this is what AZURE_CLIENT_ID must hold); service principal Object ID = $SP_OBJECT_ID (used only when assigning roles)."
            echo "  Fix (CLI, run as a subscription Owner/User Access Administrator):"
            echo "    az role assignment create --assignee-object-id $SP_OBJECT_ID --assignee-principal-type ServicePrincipal --role Contributor --scope /subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/<rg>   # or .../providers/Microsoft.Web/sites/$APP_NAME"
            echo "    az role assignment list --assignee $AZURE_CLIENT_ID --all -o table   # must show the Contributor row (allow ~2-5 min to propagate)"
            echo "  Fix (portal): Subscription -> Resource groups -> <rg> -> Access control (IAM) -> Add role assignment -> 'Privileged administrator roles' tab -> Contributor -> Members: 'User, group, or service principal' -> Select members -> search '$APP_DISPLAY' (NOT '$APP_NAME') -> Review + assign. Then IAM -> 'Check access' -> search '$APP_DISPLAY' to confirm."
            echo "  Note: 'Assign users and groups' on the Enterprise application page is SSO user assignment and has nothing to do with Azure RBAC."
            echo "  Also confirm the subscription lives in tenant $AZURE_TENANT_ID (Portal -> Subscriptions -> Directory column); if it is in another directory, use THAT tenant's id in AZURE_TENANT_ID and register the app there."
            exit 1
          fi
          if ! echo "$VISIBLE" | jq -e --arg s "$AZURE_SUBSCRIPTION_ID" '.[] | select(.id==$s)' >/dev/null; then
            echo "::error::AZURE_SUBSCRIPTION_ID ($AZURE_SUBSCRIPTION_ID) is not among the subscriptions this identity can access. Visible subscriptions:"
            echo "$VISIBLE" | jq -r '.[] | "    \(.id)  \(.name)  (tenant \(.tenant))"'
            echo "  Either fix the AZURE_SUBSCRIPTION_ID secret, or grant the service principal a role inside the intended subscription."
            exit 1
          fi
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          echo "Subscription OK: $(az account show --query name -o tsv) ($AZURE_SUBSCRIPTION_ID)"
          # Find the app among ALL Microsoft.Web/sites this identity can see.
          # Matched case-insensitively: Azure keeps the resource name in the
          # case it was created with (e.g. "SlowOAuthFn") even though the
          # hostname is lowercase, and JMESPath string comparison is
          # case-sensitive. Generic `az resource list` is also more reliable
          # than `az functionapp list` for Flex Consumption apps.
          SITES=$(az resource list --resource-type Microsoft.Web/sites --query "[].{name:name,id:id,rg:resourceGroup,kind:kind}" -o json)
          MATCH=$(echo "$SITES" | jq -c --arg n "$APP_NAME" '[.[] | select((.name|ascii_downcase)==($n|ascii_downcase))][0] // empty')
          if [ -z "$MATCH" ]; then
            APP_DISPLAY=$(az ad app show --id "$AZURE_CLIENT_ID" --query displayName -o tsv 2>/dev/null || echo "<the app registration>")
            echo "::error::The identity '$APP_DISPLAY' ($AZURE_CLIENT_ID) can sign in to subscription $AZURE_SUBSCRIPTION_ID but cannot see a Function App named '$APP_NAME' in it."
            if [ "$(echo "$SITES" | jq 'length')" = "0" ]; then
              echo "  It can see NO Microsoft.Web/sites at all, so its role assignment does not cover the app's resource group. The Contributor role must be on the resource group (or the app) for the service principal '$APP_DISPLAY' - NOT on the Function App's own managed identity (Function App -> Identity), which is a different principal and is irrelevant to GitHub Actions."
              echo "  Verify: Resource group -> Access control (IAM) -> Check access -> search '$APP_DISPLAY'   or   az role assignment list --assignee $AZURE_CLIENT_ID --all -o table"
            else
              echo "  Sites it CAN see (name / resource group / kind):"
              echo "$SITES" | jq -r '.[] | "    \(.name)  /  \(.rg)  /  \(.kind)"'
              echo "  If the app is listed under a different name, set oauthProvider.azure.functionAppName in site.config.json to that exact name. Otherwise the role assignment is scoped to a different resource group than the one holding '$APP_NAME'."
            fi
            exit 1
          fi
          ID=$(echo "$MATCH" | jq -r .id)
          ACTUAL_NAME=$(echo "$MATCH" | jq -r .name)
          RG=$(echo "$MATCH" | jq -r .rg)
          KIND=$(echo "$MATCH" | jq -r .kind)
          echo "app_name_exact=$ACTUAL_NAME" >> "$GITHUB_OUTPUT"
          if [ "$ACTUAL_NAME" != "$APP_NAME" ]; then
            echo "::warning::site.config.json says '$APP_NAME' but the Azure resource is named '$ACTUAL_NAME' (case differs). Deploying to '$ACTUAL_NAME'; consider updating oauthProvider.azure.functionAppName to match exactly."
          fi
          SITE=$(az resource show --ids "$ID" -o json)
          SKU=$(echo "$SITE" | jq -r '.properties.sku // empty')
          HOST=$(echo "$SITE" | jq -r '.properties.defaultHostName')
          STATE=$(echo "$SITE" | jq -r '.properties.state')
          echo "Function App: $ID"
          echo "  name: $ACTUAL_NAME  resource group: $RG  plan/sku: ${SKU:-unknown}  kind: $KIND  state: $STATE  host: https://$HOST"
          EXPECTED_HOST=$(echo "${{ steps.cfg.outputs.oauth_url }}" | sed 's#https\?://##')
          if [ "$HOST" != "$EXPECTED_HOST" ]; then
            echo "::error::Function App default hostname is '$HOST' but site.config.json oauthProvider.url says '$EXPECTED_HOST'. Update site.config.json (and the GitHub OAuth App callback URL) to match."
            exit 1
          fi
          [ "$STATE" = "Running" ] || echo "::warning::Function App state is '$STATE' (expected Running)."
          # (this sub-command does not accept --ids; it needs -n/-g explicitly)
          SETTINGS=$(az functionapp config appsettings list --name "$ACTUAL_NAME" --resource-group "$RG" --query "[].name" -o tsv)
          for k in OAUTH_GITHUB_CLIENT_ID OAUTH_GITHUB_CLIENT_SECRET; do
            echo "$SETTINGS" | grep -qx "$k" || { echo "::error::Function App is missing application setting $k (Settings -> Environment variables). Without it /auth returns 500."; exit 1; }
          done
          # Sanity-check the SHAPE of the GitHub client id (value is never printed).
          # Both Azure and GitHub call their ids "client ID"; the GitHub one looks like
          # 'Ov23li...' or 20 hex chars, the Entra one is a GUID and belongs in the
          # AZURE_CLIENT_ID GitHub secret, not here.
          GH_ID=$(az functionapp config appsettings list --name "$ACTUAL_NAME" --resource-group "$RG" --query "[?name=='OAUTH_GITHUB_CLIENT_ID'].value | [0]" -o tsv)
          if echo "$GH_ID" | grep -Eqi '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::OAUTH_GITHUB_CLIENT_ID on the Function App is a GUID (an Azure/Entra application id). It must be the GitHub OAuth App's Client ID (github.com -> Settings -> Developer settings -> OAuth Apps -> your app -> 'Client ID', e.g. Ov23li...). Set OAUTH_GITHUB_CLIENT_ID / OAUTH_GITHUB_CLIENT_SECRET from that GitHub page; the Entra id stays in the AZURE_CLIENT_ID repository secret."
            exit 1
          fi
          echo "$GH_ID" | grep -Eq '^(Ov23li[A-Za-z0-9]{8,}|Iv1\.[0-9a-f]{16}|Iv23li[A-Za-z0-9]{8,}|[0-9a-f]{20})$' || echo "::warning::OAUTH_GITHUB_CLIENT_ID does not look like a typical GitHub OAuth App Client ID ('Ov23li...' or 20 hex chars). Double-check it against the GitHub OAuth App page."
          echo "OAuth app settings present (client id shape: ${GH_ID:0:6}..., ${#GH_ID} chars)."
          if echo "$SETTINGS" | grep -qx "WEBSITE_RUN_FROM_PACKAGE" && echo "$SKU" | grep -qi flex; then
            echo "::error::WEBSITE_RUN_FROM_PACKAGE must NOT be set on a Flex Consumption app; remove it."; exit 1
          fi
          echo "Pre-flight OK."

      - name: Deploy (OIDC)
        id: deploy_oidc
        if: ${{ steps.method.outputs.method == 'oidc' }}
        uses: Azure/functions-action@v1
        with:
          # exact resource name as reported by Azure (case can differ from site.config.json)
          app-name: ${{ steps.preflight.outputs.app_name_exact || steps.cfg.outputs.app_name }}
          package: ${{ env.PACKAGE_PATH }}
          respect-funcignore: true
          # node_modules are installed above and shipped in the package, so no
          # remote build is needed. (On Flex Consumption the action uses
          # `remote-build` instead of the legacy scm-do-build/oryx inputs.)
          remote-build: false

      # Belt-and-braces: make sure one of the deploy steps really ran. If
      # both were skipped there is nothing to smoke-test.
      - name: Confirm a deployment step ran
        run: |
          if [ "${{ steps.deploy_profile.outcome }}" != "success" ] && [ "${{ steps.deploy_oidc.outcome }}" != "success" ]; then
            echo "::error::Neither deploy step ran successfully (publish-profile: '${{ steps.deploy_profile.outcome }}', oidc: '${{ steps.deploy_oidc.outcome }}'). Nothing was deployed."
            exit 1
          fi
          echo "Deployed via: ${{ steps.method.outputs.method }}"

      # ---- Smoke test ----------------------------------------------------
      - name: Smoke test /healthz and /auth
        run: |
          BASE="${{ steps.cfg.outputs.oauth_url }}"
          echo "Waiting for $BASE/healthz ..."
          LAST=""
          for i in $(seq 1 20); do
            LAST=$(curl -s -o /tmp/healthz.out -w '%{http_code}' --max-time 15 "$BASE/healthz" || echo "000")
            if [ "$LAST" = "200" ] && grep -q '^ok$' /tmp/healthz.out; then
              echo "healthz OK"; break
            fi
            echo "attempt $i: HTTP $LAST"
            if [ "$i" = "20" ]; then
              case "$LAST" in
                404) echo "::error::/healthz returned 404 - the Function App is running but has no 'healthz' function. Either nothing was deployed, or the functions failed to index. Check the Azure portal: Function App -> Overview -> Functions (should list auth, callback, healthz). On Flex Consumption also check Deployment Center -> Logs, and that WEBSITE_RUN_FROM_PACKAGE is not set. If the list is empty, look at Log stream for 'Worker failed to index functions' (usually a missing dependency or a syntax error in azure/functions/index.js)." ;;
                000) echo "::error::Could not connect to $BASE - is the Function App running and is oauthProvider.url in site.config.json its current default hostname?" ;;
                503) echo "::error::/healthz returned 503 - the app is still starting or crashed on startup; check Log stream." ;;
                *)   echo "::error::/healthz returned HTTP $LAST instead of 200 'ok'." ;;
              esac
              exit 1
            fi
            sleep 10
          done
          # /auth must redirect (302) to github.com. A 500 here means the
          # OAUTH_GITHUB_CLIENT_ID / _SECRET app settings are missing.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/auth")
          LOC=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 15 "$BASE/auth")
          echo "/auth -> HTTP $CODE -> $LOC"
          case "$CODE" in
            301|302|303|307|308)
              echo "$LOC" | grep -q '^https://github.com/login/oauth/authorize' || { echo "::error::/auth did not redirect to GitHub"; exit 1; }
              # The CSRF `state` cookie must accompany the redirect, otherwise
              # /callback will reject the sign-in with a 400 "state check" error.
              if ! curl -sI --max-time 15 "$BASE/auth" | grep -qi '^set-cookie: sd_oauth_state='; then
                echo "::error::/auth redirected to GitHub but did not set the 'sd_oauth_state' cookie. The Functions host dropped the cookie - make sure the deployed code returns it via the v4 'cookies' property (oauth-provider/azure/handlers.js) and that no proxy strips Set-Cookie."
                exit 1
              fi
              echo "state cookie present on /auth"
              # GitHub answers 404 on the authorize page when client_id is unknown to it.
              GH_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$LOC")
              echo "GitHub authorize page -> HTTP $GH_CODE"
              if [ "$GH_CODE" = "404" ]; then
                echo "::error::github.com/login/oauth/authorize returned 404 for this client_id: GitHub has no OAuth App with that Client ID. Fix OAUTH_GITHUB_CLIENT_ID on the Function App (use the Client ID shown on github.com -> Settings -> Developer settings -> OAuth Apps)."
                exit 1
              fi
              ;;
            500) echo "::error::/auth returned 500 - set OAUTH_GITHUB_CLIENT_ID and OAUTH_GITHUB_CLIENT_SECRET in the Function App's Application settings"; exit 1 ;;
            *)   echo "::error::Unexpected status $CODE from /auth"; exit 1 ;;
          esac
          echo "OAuth provider is live at $BASE"
