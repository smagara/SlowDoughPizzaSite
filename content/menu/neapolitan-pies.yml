title: Neapolitan Pizzas (Pizze Napoletane)
subtitle: >-
  Strict Neapolitan discipline: hand-crushed San Marzano D.O.P. tomatoes, fresh basil, 72-hour cold-fermented dough,
  flash-baked in 90 seconds at 900°F
order: 1
items:
