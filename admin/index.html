<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Slow Dough Pizza Co. — Content Admin</title>
    <link rel="icon" href="/admin/slow-dough-admin-logo.svg" />

    <!--
      This page is intentionally NOT linked from the public site
      navigation ("hidden" entry point). Real access control happens one
      layer down: Decap CMS's GitHub backend only allows sign-in for
      GitHub accounts that are collaborators on this repository. See the
      Technical Design Document for the full design rationale.

      The <link rel="cms-config-url"> tag that tells Decap where to load its
      config from is injected at dev/build time by the "slow-dough-cms-config"
      plugin in vite.config.ts, which renders admin/config.template.yml with
      the repo/URL values from site.config.json and prefixes the correct base
      path for GitHub Pages.
    -->

    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #faf8f5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /*
        Decap CMS renders almost all of its own chrome inside a React
        root and does not expose many official theming hooks for the
        outer "shell" (login screen, top nav, sidebar). What we CAN
        reliably restyle without fighting Decap's internal class names
        is this boot splash (shown before its JS paints) and the live
        "Preview" pane for each collection, which is fully themed via
        registerPreviewTemplate/registerPreviewStyle in src/admin/cms.ts.
        This is a documented limitation in the Technical Design Document.
      */
      .sd-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #faf8f5;
        color: #24211e;
        z-index: 9999;
      }

      .sd-boot-splash.sd-hidden {
        display: none;
      }

      .sd-boot-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 999px;
        background: #24211e;
        color: #faf8f5;
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-size: 22px;
      }

      .sd-boot-title {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-size: 20px;
        color: #24211e;
      }

      .sd-boot-subtitle {
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8a7a6c;
      }

      .sd-boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #e6ddd2;
        border-top-color: #c85a32;
        animation: sd-spin 0.8s linear infinite;
      }

      @keyframes sd-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Lightweight branded splash shown while the CMS bundle loads -->
    <div class="sd-boot-splash" id="sd-boot-splash">
      <div class="sd-boot-logo">SD</div>
      <div class="sd-boot-title">Slow Dough Content Admin</div>
      <div class="sd-boot-spinner"></div>
      <div class="sd-boot-subtitle">Loading editor…</div>
    </div>

    <!-- Decap CMS mounts itself here -->
    <div id="nc-root"></div>

    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
